<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Wedding Planner{% endblock %}</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background-color: #faf7f4;
        color: #4b403c;
    }

    header {
        background-color: #fffaf8;
        border-bottom: 1px solid #eadbd5;
        padding: 25px 50px;
    }

    .header-inner {
        max-width: 1200px;
        margin: 0 auto;
    }

    .logo {
        text-align: center;
        font-size: 32px;
        color: #9b6f68;
        letter-spacing: 2px;
        margin: 0;
    }

    .subtitle {
        text-align: center;
        color: #a99690;
        font-size: 14px;
        margin-top: 5px;
        font-family: Arial, sans-serif;
    }

    nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        margin-top: 25px;
    }

    nav a {
        color: #665550;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 14px;
        transition: 0.3s;
    }

    nav a:hover {
        color: #b47d74;
    }

    main {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 25px;
        min-height: 500px;
    }

    .hero {
        text-align: center;
        background-color: #f2e5df;
        padding: 80px 30px;
        border-radius: 18px;
        margin-bottom: 45px;
    }

    .hero h1 {
        font-size: 48px;
        font-weight: normal;
        color: #805b55;
        margin-bottom: 15px;
    }

    .hero p {
        max-width: 650px;
        margin: 0 auto;
        line-height: 1.7;
        font-family: Arial, sans-serif;
        color: #6f625d;
    }

    h2 {
        text-align: center;
        color: #805b55;
        font-size: 32px;
        font-weight: normal;
        margin-bottom: 35px;
    }

    h3 {
        color: #8f665f;
    }

    p {
        line-height: 1.7;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
    }

    .card {
        background-color: white;
        border: 1px solid #eadbd5;
        border-radius: 15px;
        padding: 30px;
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(100, 70, 60, 0.08);
    }

    .card h3 {
        margin-top: 0;
        font-size: 22px;
    }

    .card p {
        font-family: Arial, sans-serif;
        color: #716762;
        font-size: 14px;
    }

    .button {
        display: inline-block;
        margin-top: 15px;
        padding: 12px 25px;
        background-color: #b9857d;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        transition: 0.3s;
    }

    .button:hover {
        background-color: #9e6d66;
    }

    footer {
        text-align: center;
        border-top: 1px solid #eadbd5;
        padding: 30px;
        margin-top: 50px;
        color: #a08e88;
        font-family: Arial, sans-serif;
        font-size: 13px;
    }

    .section {
        margin-bottom: 60px;
    }

    .quote {
        text-align: center;
        font-style: italic;
        color: #9a7b73;
        font-size: 20px;
        margin: 50px auto;
        max-width: 700px;
    }

    @media (max-width: 600px) {
        header {
            padding: 20px;
        }

        .logo {
            font-size: 26px;
        }

        nav {
            gap: 15px;
        }

        .hero {
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 36px;
        }
    }
</style>

</head>

<body>

<header>
    <div class="header-inner">
        <h1 class="logo">Вилла Роз</h1>
        <div class="subtitle">Создаём свадьбу вашей мечты</div>

    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('places') }}">Места</a>
        <a href="{{ url_for('program') }}">Ведущий и программа</a>
        <a href="{{ url_for('menu') }}">Меню и торт</a>
        <a href="{{ url_for('decor') }}">Оформление</a>
    </nav>
</div>


</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    Вилла Роз · Ваш особенный день начинается здесь ♡
</footer>

</body>
</html>
